    <script>
      // Aplica o tema antes de a página aparecer: o salvo pelo visitante ou o do sistema.
      try {
        var tema = localStorage.getItem("tema") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.dataset.theme = tema;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
