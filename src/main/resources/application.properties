spring.application.name=portfolioai

# Hospedagens como o Render definem a porta pela variável PORT.
server.port=${PORT:8080}

# ==============================
# APIs DE IA
# ==============================

gemini.api.key=${GEMINI_API_KEY}
groq.api.key=${GROQ_API_KEY}


# ==============================
# SEGURANÇA DA API PÚBLICA
# ==============================

# Origens do frontend, separadas por vírgula.
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:*}

# Tamanho máximo da pergunta, em caracteres.
app.chat.max-message-length=${CHAT_MAX_MESSAGE_LENGTH:1000}

# Requisições ao chat permitidas por IP a cada minuto.
app.chat.rate-limit-per-minute=${CHAT_RATE_LIMIT_PER_MINUTE:15}

# Limite total de requisições ao chat por minuto, somando todos os IPs.
app.chat.global-rate-limit-per-minute=${CHAT_GLOBAL_RATE_LIMIT_PER_MINUTE:120}


# ==============================
# BANCO DE DADOS
# ==============================

# Local: H2 em arquivo. Produção: defina DB_URL, DB_USERNAME e DB_PASSWORD
# (ex.: jdbc:postgresql://host/banco?sslmode=require). O driver é detectado
# automaticamente pela URL.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/portfolioai}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Mantém as conexões abaixo do limite dos planos gratuitos.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}


# ==============================
# JPA / HIBERNATE
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
